name: Test

# The index is data, but the finder is code, and until now none of it was
# tested on push. Every UI bug fixed this month -- an action pill sitting on
# top of a topic tag, a warning at 3.49:1 contrast, "all blogs" returning to
# all posts -- was caught by running these suites BY HAND. That is not a
# safety net, that is a habit.
#
# This does NOT run on the refresh bot's commits. GitHub deliberately does not
# trigger workflows for pushes made with GITHUB_TOKEN, to stop workflows looping
# -- verified: the bot's commit fired only pages-build-deployment. That is why
# refresh-blog-index.yml runs these same suites itself, before it commits. That
# step is the only thing testing a refreshed index, not a second opinion.

on:
  push:
    branches: [main]
    paths:
      - "blogs/**"
      - "pipeline/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "blogs/**"
      - "pipeline/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      # 26 assertions about the index files agreeing with each other. No
      # baseline argument: on a push the committed index IS the baseline, and
      # regression is only meaningful against the run that replaced it.
      - name: Check index consistency
        run: python pipeline/check_index.py blogs/data

      # Where a feed post links, for each blog shape the link-blog rule broke
      # before a guard was added: crafted feeds through the real parser and
      # build. The index checks above cannot see this -- a wrong but loadable
      # URL is perfectly consistent.
      - name: Check feed post links
        run: python pipeline/test_feed_links.py

      # Which blog a URL belongs to: fediverse posts, platforms that moved or
      # give authors subdomains, and one Medium writer at two addresses --
      # through the real aggregation and build, which must agree.
      - name: Check blog identity
        run: python pipeline/test_identity.py

      # Recall against ground truth the search did not produce.
      - name: Check search recall
        run: python pipeline/search_eval.py

      # 82 assertions driving the real page in a real browser.
      - name: Check the finder in a browser
        run: python pipeline/browser_test.py
