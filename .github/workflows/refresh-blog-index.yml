name: Refresh blog index

# The index is a build artifact of two sources: Hacker News (via Algolia) and
# the blogs' own feeds. Both drift, so this rebuilds them on a schedule.
#
# What this job does NOT do is classify blogs. Assigning source/topic/kind is an
# LLM step run out-of-band (see pipeline/README.md); its output is committed to
# pipeline/classified/ and treated as an input here. A newly discovered blog is
# therefore absent from the index until the next classification pass -- which is
# the correct failure mode, because an unclassified blog has no `source`, and
# `source` is what decides whether it is hidden behind the newsroom toggle.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *" # 04:17 UTC on the 1st of each month

permissions:
  contents: write

concurrency:
  group: blog-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # A full pull is ~510 requests and ~15 min. Cached between runs so a
      # re-run on the same day is cheap; the cache is advisory, never required.
      - name: Restore HN corpus cache
        uses: actions/cache/restore@v4
        with:
          path: work/hn_stories.jsonl
          key: hn-corpus-${{ github.run_id }}
          restore-keys: hn-corpus-

      - name: Pull Hacker News stories
        id: pull
        env:
          THRESHOLD: "25"
          OUT: work/hn_stories.jsonl
          # With a restored cache only the new head is missing; walking back to
          # 2006 every month would be ~500 pointless requests.
          STOP_AFTER_SEEN: "3"
        run: |
          mkdir -p work
          python pipeline/pull_hn.py

      # Saved when the PULL succeeded, even if a later step fails -- a downstream
      # failure must not throw away 510 requests' worth of pull. But never when
      # the pull itself failed: pull_hn.py walks backwards from now and appends
      # as it goes, so a pull that dies midway leaves only the NEWEST stories.
      # restore-keys picks the most recently created cache, so that truncated
      # file would win over an older complete one -- and STOP_AFTER_SEEN then
      # stops the next run long before it reaches the gap. The hole would be
      # permanent.
      - name: Save HN corpus cache
        if: always() && steps.pull.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: work/hn_stories.jsonl
          key: hn-corpus-${{ github.run_id }}

      - name: Deduplicate
        run: python pipeline/dedupe.py work/hn_stories.jsonl work/hn_dedup.jsonl

      - name: Aggregate into candidate blogs
        run: python pipeline/aggregate_domains.py work/hn_stories.jsonl work/candidates.jsonl 3

      # Feed fetching is latency-bound. Unseeded it ran at ~50 blogs/min, so a
      # full pass over 13.4k blogs was about four hours and this job would have
      # timed out every month, producing nothing. It is now cached, resumable,
      # time-boxed and seeded from pipeline/feed_urls.tsv.
      #
      # restore/save rather than actions/cache, so the save runs even when a
      # later step fails. actions/cache only saves on success, which would have
      # made a failing run repeat itself forever: the regression guard fails,
      # the job fails, the partial fetch is discarded, and the next run starts
      # from exactly the same cold state.
      #
      # GitHub deletes a cache nobody reads for 7 days -- far sooner than this
      # job comes back -- so keep-caches-warm.yml reads both caches weekly.
      - name: Restore feed cache
        uses: actions/cache/restore@v4
        with:
          path: work/feeds.jsonl
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      - name: Fetch feeds for classified blogs
        env:
          # Sized for the FIRST run, which has to resolve every blog from
          # cold: measured at 123 blogs/min over a representative sample, so
          # 13.4k blogs is ~110 min. Later runs are far cheaper -- once the
          # seed knows a blog's answer, positives cost one request and
          # negatives cost none -- so this budget is mostly never spent.
          # Actions minutes are free on a public repo.
          TIME_BUDGET: "7200" # 120 min of a 170 min job
          # A feed fetched last month is not freshness -- but "last month" has
          # to mean under the SHORTEST gap between runs, not 30 days. The cron
          # fires on the 1st, so after February or any 30-day month every feed
          # fetched by the previous run was minutes short of 30 days old and
          # was skipped: five runs a year refetched almost nothing.
          REFRESH_DAYS: "25"
        run: |
          python pipeline/select_for_feeds.py \
            work/candidates.jsonl pipeline/classified work/feed_targets.jsonl
          python pipeline/fetch_feeds.py work/feed_targets.jsonl work/feeds.jsonl 64

      - name: Save feed cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/feeds.jsonl
          key: feeds-${{ github.run_id }}

      # A classification agent that reads the wrong evidence file produces
      # perfectly valid-looking output while silently dropping a whole batch.
      # Catch that before it reaches the index.
      - name: Validate committed classifications
        run: |
          python - <<'EOF'
          import json
          rows = [json.loads(l) for l in open("work/candidates.jsonl")]
          with open("work/expected.jsonl", "w") as f:
              for r in rows:
                  if r["n_stories"] >= 3:
                      f.write(json.dumps({"key": r["key"]}) + "\n")
          EOF
          python pipeline/validate_classifications.py \
            work/expected.jsonl pipeline/classified || \
            echo "::warning::classification coverage is incomplete; index will omit blogs"

      # Keep the index we are about to overwrite, so the new one can be compared
      # against it. Every other check asks whether the index is internally
      # consistent, and a much smaller index is perfectly consistent.
      - name: Snapshot the current index size
        run: cp blogs/data/meta.json work/prev_meta.json

      # dead_urls.txt is the committed distillation of a full HEAD-check crawl
      # (154k URLs, ~10h -- far past this job's budget). Link rot is one-way and
      # concentrated in old posts, so replaying the known-dead set is accurate
      # between crawls; re-run pipeline/check_links.py by hand to refresh it.
      - name: Build search index
        run: |
          python pipeline/build_index.py \
            work/hn_dedup.jsonl work/candidates.jsonl pipeline/classified \
            blogs/data work/feeds.jsonl pipeline/dead_urls.txt
        env:
          FEED_CAP: "12"

      - name: Sanity-check the built index
        run: python pipeline/check_index.py blogs/data work/prev_meta.json

      # The only thing that tests a refreshed index. test.yml does not run on
      # this job's commit: GitHub does not trigger workflows for pushes made
      # with GITHUB_TOKEN, so the bot's commit fires nothing but the Pages
      # deploy. Without this step a refresh that broke search would go straight
      # to production unexamined. ~90s against a 170 minute job.
      - name: Check the new index in a browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python pipeline/search_eval.py
          python pipeline/browser_test.py

      # The corpus size is quoted in prose on two pages. Left alone it drifts:
      # the portfolio was still advertising 111k posts from 5,979 blogs after
      # the index had grown to 165k and 10,535.
      - name: Sync quoted corpus counts
        run: python pipeline/sync_counts.py

      # Teach the next run what this one discovered. Merge-only: a time-boxed
      # fetch is partial by design, and rewriting the seed from it would drop
      # every blog the run did not reach.
      - name: Update the feed-URL seed
        run: python pipeline/update_feed_urls.py pipeline/feed_urls.tsv work/feeds.jsonl

      # Push, and if main moved underneath us, replay onto the new head rather
      # than losing the run. This job takes up to two hours; a single unrelated
      # commit during that window rejected the push and discarded everything --
      # observed on the first real run.
      #
      # Replay, not rebase. What we produce is generated output, so the right
      # resolution is unconditionally ours for blogs/data and the feed seed --
      # while the prose files are NOT restored from our copy, because main may
      # have edited them for unrelated reasons. sync_counts.py rewrites the
      # numbers into whatever those files now say.
      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARTIFACTS="blogs/data pipeline/feed_urls.tsv"
          TRACKED="$ARTIFACTS blogs/index.html index.html sitemap.xml"

          git add $TRACKED
          if git diff --cached --quiet; then
            echo "index unchanged; nothing to commit"
            exit 0
          fi
          MSG="Refresh blog index ($(date -u +%Y-%m-%d))"
          git commit -m "$MSG"

          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; main moved. Replaying onto the new head."
            tar -cf /tmp/artifacts.tar $ARTIFACTS
            git fetch origin main
            git reset --hard origin/main
            tar -xf /tmp/artifacts.tar
            python pipeline/sync_counts.py
            git add $TRACKED
            if git diff --cached --quiet; then
              echo "new head already carries this index; nothing to do"
              exit 0
            fi
            git commit -m "$MSG"
          done
          echo "::error::could not push after 3 attempts"
          exit 1
